services:
  - type: web
    name: freedom
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: 168
      - key: PORT
        value: 3000
      - key: STORAGE_DRIVER
        value: mysql
      - key: DATABASE_DSN
        value: "freedom:freedom123@tcp(127.0.0.1:3306)/freedom?parseTime=true&charset=utf8mb4&loc=Local"
