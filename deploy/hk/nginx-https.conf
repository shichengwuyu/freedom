# xiaoyxiao.xyz Nginx HTTPS 反向代理配置
# 用法：由 setup-https.sh 自动写入到 /etc/nginx/conf.d/xiaoyxiao.conf
# 证书路径默认由 certbot 生成：/etc/letsencrypt/live/xiaoyxiao.xyz/

# ---------- HTTP -> HTTPS 自动跳转 ----------
server {
    listen 80;
    server_name xiaoyxiao.xyz www.xiaoyxiao.xyz;

    # certbot 续期时用此路径做 http-01 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求一律跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl http2;
    server_name xiaoyxiao.xyz www.xiaoyxiao.xyz;

    # 证书路径（certbot 申请后生成）
    ssl_certificate     /etc/letsencrypt/live/xiaoyxiao.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoyxiao.xyz/privkey.pem;

    # TLS 优化参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传体积（图片/视频/模型）
    client_max_body_size 100m;

    # API 请求转发到 Go 后端（容器内 3000 端口映射到宿主机 3000）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        # 慢网/大文件（视频、远程媒体代理）不被默认 60s 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 8 256k;
        proxy_temp_file_write_size 256k;
    }

    # WebSocket 支持（画布实时协作等）
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其他请求转发到 Next.js 前端
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;
        # 慢网/大文件（视频 content 回退、前端静态资源）不被默认 60s 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 8 256k;
        proxy_temp_file_write_size 256k;
    }
}
