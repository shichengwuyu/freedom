services:
  # MinIO 对象存储，替代云 OSS：后端把上传文件推到这里，浏览器再从公网直链拉取。
  minio:
    image: minio/minio:latest
    container_name: freedom-minio
    command: server /data --console-address ":9001"
    environment:
      # 控制台/根账号，由 .env 注入。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # 对象数据持久化到宿主机。
      - ./minio-data:/data
    ports:
      # 9000: S3 API（浏览器直链走这个端口）；9001: 管理控制台。
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 一次性初始化：创建业务 bucket 并设为匿名可读（浏览器直链需要公开读）。
  minio-init:
    image: minio/mc:latest
    container_name: freedom-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo MINIO_INIT_DONE
      "
    restart: "no"

  # MySQL 8 数据库，供后端持久化使用。
  mysql:
    image: mysql:8.0
    container_name: freedom-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # root 密码与业务库、业务账号，由 .env 注入。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # 数据库文件持久化到宿主机，避免容器重建后丢数据。
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      # 用 root 账号 ping，数据库就绪后 app 才启动。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 应用（Next.js + Go），本地源码构建。
  app:
    image: freedom:local
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: freedom
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # 上传文件、日志、提示词等运行时数据持久化到宿主机。
      - ./data:/app/data
    ports:
      # 宿主机 3000 -> 容器内 Next.js 3000（80 端口留给 Nginx 做反向代理）。
      - "3000:3000"
    restart: unless-stopped
